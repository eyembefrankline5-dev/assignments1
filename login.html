<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Franklin Care Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #1d1d1f; background: radial-gradient(circle at 15% 15%, rgba(255,255,255,.95), transparent 30%), radial-gradient(circle at 85% 20%, rgba(180,210,255,.40), transparent 35%), radial-gradient(circle at 50% 100%, rgba(220,230,245,.55), transparent 42%), #eef2f7; }
        .login-container { width: 100%; max-width: 430px; padding: 38px 34px; background: rgba(255,255,255,.48); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,.78); border-radius: 30px; box-shadow: 0 24px 60px rgba(31,41,55,.12), inset 0 1px 0 rgba(255,255,255,.9); text-align: center; }
        .brand-icon { width: 62px; height: 62px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: rgba(0,113,227,.10); border: 1px solid rgba(255,255,255,.8); color: #0071e3; }
        .brand-icon svg { width: 31px; height: 31px; stroke: currentColor; }
        .login-container h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -.6px; }
        .login-container h2 { margin: 28px 0 7px; font-size: 28px; font-weight: 700; letter-spacing: -.8px; }
        .subtitle { margin: 0 0 28px; color: #6e6e73; font-size: 14px; }
        form { text-align: left; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; color: #48484a; font-size: 12px; font-weight: 600; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 14px 46px 14px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,.85); background: rgba(255,255,255,.68); color: #1d1d1f; font-size: 14px; outline: none; box-sizing: border-box; transition: .25s ease; }
        .input-wrapper input:focus { border-color: rgba(0,113,227,.35); background: rgba(255,255,255,.82); box-shadow: 0 0 0 4px rgba(0,113,227,.08); }
        .login-btn { width: 100%; margin-top: 5px; padding: 14px 18px; border: none; border-radius: 15px; background: rgba(0,113,227,.94); color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: .25s ease; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,113,227,.25); }
        .signup-text { margin: 23px 0 0; color: #6e6e73; font-size: 13px; text-align: center; }
        .signup-text a { color: #0071e3; text-decoration: none; font-weight: 600; }
        #errorMsg { color: red; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M3 12h18"></path><rect x="4" y="4" width="16" height="16" rx="4"></rect></svg>
        </div>
        <h1>Franklin Care Center</h1>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to access your account</p>
        
        <div id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="signup-text">Don't have an account? <a href="signup.html">Create an account</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('backend/api/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();
                if (result.success) {
                    if (result.role === 'admin') window.location.href = 'admin-dashboard.html';
                    else if (result.role === 'doctor') window.location.href = 'doctor-dashboard.html';
                    else window.location.href = 'patient-dashboard.html';
                } else {
                    errorMsg.textContent = result.message || 'Invalid credentials';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = "Network error. Please try again.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
