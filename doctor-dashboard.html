<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Franklin Care Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar glass-panel">
            <h2>Doctor Portal</h2>
            <a href="doctor-dashboard.html" class="active">Dashboard</a>
            <a href="#" id="logoutBtn">Logout</a>
        </aside>
        <main class="dashboard-main">
            <header class="page-heading">
                <h2>Doctor Dashboard</h2>
                <p id="welcomeMessage">Loading...</p>
            </header>
            <div id="stats" class="glass-panel" style="padding: 20px;">
                Pending Appointments: <span id="appCount">0</span>
            </div>
        </main>
    </div>
    <script>
        async function checkAuth() {
            const res = await fetch('backend/api/auth.php?action=check');
            const data = await res.json();
            if (!data.success || data.role !== 'doctor') {
                window.location.href = 'login.html';
            } else {
                loadDashboard();
            }
        }

        async function loadDashboard() {
            const res = await fetch('backend/api/dashboard.php');
            const data = await res.json();
            if (data.success) {
                document.getElementById('welcomeMessage').textContent = data.data.welcome_message;
                document.getElementById('appCount').textContent = data.data.pending_appointments;
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('backend/api/auth.php?action=logout');
            window.location.href = 'login.html';
        });

        checkAuth();
    </script>
</body>
</html>
